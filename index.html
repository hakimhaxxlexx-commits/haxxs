<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewer - Logitech Webcam</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header span {
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }

    main {
      position: relative;
      flex: 1;
      width: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .controls {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 0.75rem 1.25rem;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.5rem 0.9rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    button.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }

    footer {
      padding: 0.75rem 1.5rem;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      z-index: 10;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Logitech Webcam — 3D Interactive</h1>
    <span>glTF 2.0 Model</span>
  </header>

  <main>
    <model-viewer
      id="webcam-viewer"
      src="binatang/scene.gltf"
      alt="Model 3D Logitech Webcam"
      camera-controls
      auto-rotate
      auto-rotate-delay="1000"
      shadow-intensity="1.2"
      exposure="1"
      environment-image="neutral"
      ar
      ar-modes="webxr scene-viewer quick-look">
    </model-viewer>

    <div class="controls">
      <button id="btn-rotate" class="active" onclick="toggleRotate()">Auto-Rotate: ON</button>
      <button onclick="setCamera('0deg 75deg 105%')">Tampak Depan</button>
      <button onclick="setCamera('90deg 75deg 105%')">Tampak Samping</button>
      <button onclick="setCamera('180deg 75deg 105%')">Tampak Belakang</button>
      <button onclick="resetView()">Reset Kamera</button>
    </div>
  </main>

  <footer>
    This work is based on
    <a href="https://sketchfab.com/3d-models/logitech-webcam-f6f8675406b7437faaf96a1f82062028" target="_blank" rel="noopener">"Logitech Webcam"</a>
    by <a href="https://sketchfab.com/SpencerCohen" target="_blank" rel="noopener">Spencer Adam Cohen</a>
    licensed under <a href="http://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC-BY-NC-4.0</a>.
  </footer>

  <script>
    const viewer = document.getElementById('webcam-viewer');
    const btnRotate = document.getElementById('btn-rotate');

    function toggleRotate() {
      viewer.autoRotate = !viewer.autoRotate;
      btnRotate.textContent = viewer.autoRotate ? 'Auto-Rotate: ON' : 'Auto-Rotate: OFF';
      btnRotate.classList.toggle('active', viewer.autoRotate);
    }

    function setCamera(orbit) {
      viewer.autoRotate = false;
      btnRotate.textContent = 'Auto-Rotate: OFF';
      btnRotate.classList.remove('active');
      viewer.cameraOrbit = orbit;
    }

    function resetView() {
      viewer.cameraOrbit = 'auto auto auto';
      viewer.fieldOfView = 'auto';
      viewer.autoRotate = true;
      btnRotate.textContent = 'Auto-Rotate: ON';
      btnRotate.classList.add('active');
    }
  </script>

</body>
</html>
